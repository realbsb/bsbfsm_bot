name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Укажите вашу версию Python, если нужна другая

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with Ruff
      run: |
        pip install ruff
        ruff check .

    - name: Run tests
      run: |
        if python -m pytest --version >/dev/null 2>&1; then
          pytest
        else
          echo "Pytest не установлен в requirements.txt, пропускаем тесты."
        fi
