# /etc/angie/sites-enabled/realbsb.ru.conf
# Workflow за Angie на 192.168.0.1.

server {
    listen 80;
    server_name realbsb.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name realbsb.ru;

    ssl_certificate     /etc/letsencrypt/live/realbsb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realbsb.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Workflow ---
    location /workflow/ {
        # Слэш на конце срезает /workflow/ из пути
        proxy_pass http://192.168.0.150:8080/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /workflow;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 64m;
    }

    # --- Основной сайт realbsb.ru ---
    location / {
        root /var/www/realbsb;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
